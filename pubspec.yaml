name: skillx
description: Prototype converted from React to Flutter (first screens).
publish_to: "none"
version: 0.0.1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  internet_connection_checker: ^3.0.1
  app_links: ^6.4.1
  image_picker: ^1.2.0
  pdf: ^3.11.3
  printing: ^5.14.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  device_info_plus: ^9.1.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  fluttertoast: ^8.2.1
  supabase_flutter: ^2.10.3
  http: ^1.6.0
  dart_jsonwebtoken: ^3.3.1
  uuid: ^4.5.2
  flutter_markdown_plus: ^1.0.5
  web_socket_channel: ^3.0.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
